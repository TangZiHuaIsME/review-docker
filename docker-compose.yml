# Docker Compose 文件版本（版本3 支持 swarm 和大多数功能）
version: '3.8'

# 定义服务（容器）
services:
  # 服务1：PostgreSQL 数据库
  db:
    # 使用官方 PostgreSQL 16 镜像（Alpine 版，体积小）
    image: postgres:16-alpine
    
    # 容器名称（方便管理）
    container_name: myapp-db
    
    # 环境变量（会传递给容器内部）
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    
    # 端口映射：宿主机端口:容器端口
    ports:
      - "5432:5432"
    
    # 数据卷：持久化数据（容器删了数据还在）
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    # 健康检查：判断数据库是否就绪
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 服务2：Node.js Web 应用
  web:
    # 使用当前目录的 Dockerfile 构建镜像
    build: .
    
    # 容器名称
    container_name: myapp-web
    
    # 端口映射：宿主机8080映射到容器3000
    ports:
      - "8080:3000"
    
    # 环境变量（会覆盖 Dockerfile 里的默认值）
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mydb
    
    # 依赖：等 db 服务启动后再启动 web
    depends_on:
      db:
        condition: service_healthy
    
    # 数据卷：开发时实时同步代码（改代码不用 rebuild）
    volumes:
      - .:/app
      - /app/node_modules

# 定义命名卷（用于持久化数据）
volumes:
  postgres_data:
